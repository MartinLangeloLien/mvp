<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Volt — Phase 1 Registration</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --volt-bg: #0f1117;
    --volt-surface: #1a1d27;
    --volt-border: #2a2d3a;
    --volt-accent: #6c63ff;
    --volt-accent2: #00d4aa;
    --volt-warn: #f5a623;
    --volt-error: #e74c3c;
    --volt-text: #e8eaf0;
    --volt-muted: #8b8fa8;
  }
  body { background: var(--volt-bg); color: var(--volt-text); font-family: 'Inter', system-ui, sans-serif; }
  .card { background: var(--volt-surface); border: 1px solid var(--volt-border); border-radius: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill-user { background: #1e3a5f; color: #7eb8f7; }
  .pill-system { background: #1f3d2f; color: #6fdfaa; }
  .pill-reviewer { background: #3d2f1f; color: #f0a860; }
  .btn { cursor: pointer; padding: 9px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: all 0.15s; border: none; }
  .btn-primary { background: var(--volt-accent); color: white; }
  .btn-primary:hover { background: #7c74ff; }
  .btn-secondary { background: var(--volt-border); color: var(--volt-text); }
  .btn-secondary:hover { background: #3a3d4f; }
  .btn-danger { background: #3d1515; color: #f77; border: 1px solid #5a1a1a; }
  .btn-danger:hover { background: #5a1515; }
  .input { background: var(--volt-bg); border: 1px solid var(--volt-border); color: var(--volt-text); border-radius: 8px; padding: 9px 12px; font-size: 14px; width: 100%; outline: none; transition: border-color 0.15s; }
  .input:focus { border-color: var(--volt-accent); }
  .input-error { border-color: var(--volt-error) !important; }
  select.input option { background: var(--volt-surface); }
  .label { font-size: 12px; color: var(--volt-muted); margin-bottom: 4px; font-weight: 500; }
  .state-node { cursor: pointer; transition: all 0.15s; }
  .state-node.active { box-shadow: 0 0 0 2px var(--volt-accent), 0 0 20px rgba(108,99,255,0.3); }
  .state-node.completed { box-shadow: 0 0 0 2px var(--volt-accent2); }
  .state-node.terminal { box-shadow: 0 0 0 2px var(--volt-error); }
  .webhook-item { font-size: 11px; font-family: 'Courier New', monospace; background: #0d0f18; border: 1px solid #1e2235; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
  .progress-bar-fill { height: 4px; background: linear-gradient(90deg, var(--volt-accent), var(--volt-accent2)); border-radius: 2px; transition: width 0.4s ease; }
  .tab { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--volt-muted); transition: all 0.15s; }
  .tab.active { background: var(--volt-border); color: var(--volt-text); }
  .feedback-item { border-left: 3px solid; padding: 10px 14px; border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 13px; }
  .feedback-error { border-color: var(--volt-error); background: rgba(231,76,60,0.08); }
  .feedback-warn { border-color: var(--volt-warn); background: rgba(245,166,35,0.08); }
  .feedback-info { border-color: #3b82f6; background: rgba(59,130,246,0.08); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .badge-auto { background: #1a2e1a; color: #6fdfaa; border: 1px solid #2a4a2a; font-size: 10px; padding: 2px 7px; border-radius: 4px; }
  .badge-open { background: #2e2a1a; color: #f0a860; border: 1px solid #4a3a1a; font-size: 10px; padding: 2px 7px; border-radius: 4px; }
  .tooltip { position: relative; }
  .tooltip .tip { display: none; position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%); background: #1a1d27; border: 1px solid #2a2d3a; padding: 6px 10px; border-radius: 6px; font-size: 11px; white-space: nowrap; z-index: 10; color: var(--volt-muted); }
  .tooltip:hover .tip { display: block; }
</style>
</head>
<body class="min-h-screen">

<!-- TOP NAV -->
<nav class="flex items-center justify-between px-6 py-4 border-b border-[#2a2d3a]">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-[#6c63ff] to-[#00d4aa] flex items-center justify-center text-white font-black text-sm">V</div>
    <span class="font-bold text-lg tracking-tight">Volt</span>
    <span class="text-[#8b8fa8] text-sm ml-1">/ Registration</span>
  </div>
  <div class="flex items-center gap-3">
    <span id="phase-badge" class="pill pill-system">Phase 1 — Audit</span>
    <span id="channel-badge" class="pill" style="background:#1e2035;color:#a0a8c8;display:none"></span>
    <button class="btn btn-danger text-xs px-3 py-1" onclick="closeRegistration()" id="close-btn" style="display:none">Close Registration</button>
  </div>
</nav>

<div class="flex h-[calc(100vh-65px)]">

  <!-- LEFT SIDEBAR — State Machine -->
  <aside class="w-52 border-r border-[#2a2d3a] p-4 overflow-y-auto flex-shrink-0">
    <div class="text-xs font-semibold text-[#8b8fa8] uppercase tracking-wider mb-3">States</div>
    <div id="state-nav" class="space-y-1"></div>

    <div class="mt-6">
      <div class="text-xs font-semibold text-[#8b8fa8] uppercase tracking-wider mb-3">Progress</div>
      <div class="bg-[#0f1117] rounded-lg h-1.5 overflow-hidden">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
      </div>
      <div id="progress-label" class="text-xs text-[#8b8fa8] mt-2">Not started</div>
    </div>

    <div class="mt-6">
      <div class="text-xs font-semibold text-[#8b8fa8] uppercase tracking-wider mb-3">Artifact</div>
      <div id="artifact-summary" class="text-xs text-[#8b8fa8] space-y-1.5"></div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 overflow-y-auto p-6">
    <div id="main-content" class="max-w-2xl mx-auto fade-in"></div>
  </main>

  <!-- RIGHT SIDEBAR — Webhooks & Log -->
  <aside class="w-64 border-l border-[#2a2d3a] p-4 overflow-y-auto flex-shrink-0">
    <div class="flex gap-2 mb-4">
      <div class="tab active" id="tab-webhooks" onclick="switchTab('webhooks')">Webhooks</div>
      <div class="tab" id="tab-log" onclick="switchTab('log')">Event Log</div>
    </div>
    <div id="webhook-list"></div>
    <div id="log-list" style="display:none"></div>
  </aside>

</div>

<script>
// ============================================================
// STATE MACHINE DEFINITION
// ============================================================
const STATES = {
  S1: { id:'S1', name:'Draft', label:'P1:S1 — Draft', actor:'User', flags:['start'], color:'#6c63ff' },
  S2: { id:'S2', name:'Campaign Audit', label:'P1:S2 — Campaign Audit In Progress', actor:'System', flags:['auto','substates'], color:'#3b82f6' },
  S3: { id:'S3', name:'Audit Feedback', label:'P1:S3 — Audit Feedback Presented', actor:'User', flags:[], color:'#6c63ff' },
  S4: { id:'S4', name:'Brand Collection', label:'P1:S4 — Brand Collection', actor:'User', flags:[], color:'#6c63ff' },
  S5: { id:'S5', name:'Brand Validation', label:'P1:S5 — Brand Validation', actor:'System', flags:['substates'], color:'#3b82f6' },
  S6: { id:'S6', name:'Brand Feedback', label:'P1:S6 — Brand Feedback Provided', actor:'User', flags:['open'], color:'#f5a623' },
  S7: { id:'S7', name:'Pending Registry', label:'P1:S7 — Pending Registry Submission', actor:'System', flags:['auto'], color:'#3b82f6' },
  S8: { id:'S8', name:'Closed', label:'P1:S8 — Closed', actor:'terminal', flags:['terminal'], color:'#e74c3c' },
  P2: { id:'P2', name:'Registry Submitted', label:'P2 — Registry Submitted', actor:'System', flags:[], color:'#00d4aa' },
};

const CHANNEL_TYPES = ['10DLC', 'TFN (Toll-Free)', 'Short Code'];

// ============================================================
// APPLICATION STATE
// ============================================================
let app = {
  currentState: null,
  registration: {},
  webhooks: [],
  eventLog: [],
  activeTab: 'webhooks',
  auditProcessing: false,
  brandProcessing: false,
  registryProcessing: false,
};

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  renderStateNav();
  renderWelcome();
});

function renderWelcome() {
  document.getElementById('main-content').innerHTML = `
    <div class="card p-8 text-center fade-in">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#6c63ff] to-[#00d4aa] flex items-center justify-center mx-auto mb-6 text-3xl">V</div>
      <h1 class="text-2xl font-bold mb-2">Volt Registration Platform</h1>
      <p class="text-[#8b8fa8] mb-1 text-sm">Phase 1 — Campaign Audit & Brand Validation</p>
      <p class="text-[#8b8fa8] text-xs mb-8 max-w-md mx-auto">Submit your SMS campaign registration for 10DLC, Toll-Free, or Short Code. The system will audit your campaign content and validate your brand before submitting to the registry.</p>
      <button class="btn btn-primary text-base px-8 py-3" onclick="startRegistration()">
        + New Registration
      </button>
    </div>
  `;
}

function startRegistration() {
  app.registration = {
    id: 'REG-' + Math.random().toString(36).slice(2,8).toUpperCase(),
    createdAt: new Date().toISOString(),
    channelType: null,
    campaign: {},
    brand: {},
    auditFeedback: null,
    brandFeedback: null,
    cnpSuggestion: null,
    cnpOverridden: false,
    autoApproved: false,
    feedbackDisposition: {},
    brandFeedbackDisposition: {},
    cycleCount: 0,
    brandCycleCount: 0,
    closureReason: null,
  };
  document.getElementById('close-btn').style.display = 'block';
  transitionTo('S1');
}

// ============================================================
// STATE TRANSITIONS
// ============================================================
function transitionTo(stateId) {
  const prev = app.currentState;
  app.currentState = stateId;

  logEvent(`Transition: ${prev ? prev : 'none'} → ${stateId}`, 'transition');
  renderStateNav();
  updateArtifactSummary();

  const renders = {
    S1: renderS1, S2: renderS2, S3: renderS3,
    S4: renderS4, S5: renderS5, S6: renderS6,
    S7: renderS7, S8: renderS8, P2: renderP2,
  };
  if (renders[stateId]) renders[stateId]();

  const badge = document.getElementById('channel-badge');
  if (app.registration.channelType) {
    badge.textContent = app.registration.channelType;
    badge.style.display = 'inline-flex';
  }
  updateProgress();
}

// ============================================================
// STATE RENDERERS
// ============================================================

// S1 — Draft
function renderS1() {
  const r = app.registration;
  const channelOptions = CHANNEL_TYPES.map(c =>
    `<option value="${c}" ${r.channelType === c ? 'selected' : ''}>${c}</option>`
  ).join('');

  document.getElementById('main-content').innerHTML = `
    <div class="fade-in">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center text-sm font-bold" style="background:#1e1a40;color:#6c63ff">S1</div>
        <div>
          <div class="font-semibold">Draft</div>
          <div class="text-xs text-[#8b8fa8]">Complete all required campaign fields before submitting</div>
        </div>
        <div class="ml-auto pill pill-user">User</div>
      </div>

      <div class="card p-5 mb-4">
        <div class="text-xs font-semibold text-[#8b8fa8] uppercase tracking-wider mb-4">Channel Type <span class="text-red-400">*</span></div>
        <select class="input" id="channelType" onchange="onChannelTypeChange()">
          <option value="">Select channel type...</option>
          ${channelOptions}
        </select>
        <p class="text-xs text-[#8b8fa8] mt-2">Must be set first — drives required field set for the rest of the form.</p>
      </div>

      <div class="card p-5 mb-4" id="campaign-fields" style="${r.channelType ? '' : 'display:none'}">
        <div class="text-xs font-semibold text-[#8b8fa8] uppercase tracking-wider mb-4">Campaign Fields</div>
        <div class="space-y-4">
          <div>
            <div class="label">Message Description <span class="text-red-400">*</span></div>
            <textarea class="input" id="messageDesc" rows="2" placeholder="Describe the messages you'll send...">${r.campaign.messageDesc||''}</textarea>
          </div>
          <div>
            <div class="label">Example Message Copy <span class="text-red-400">*</span></div>
            <textarea class="input" id="exampleMsg" rows="2" placeholder="Hi [Name], here is your order update...">${r.campaign.exampleMsg||''}</textarea>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <div class="label">Home Page URL <span class="text-red-400">*</span></div>
              <input class="input" id="homepageUrl" value="${r.campaign.homepageUrl||''}" placeholder="https://example.com" />
            </div>
            <div>
              <div class="label">Privacy Policy URL <span class="text-red-400">*</span></div>
              <input class="input" id="privacyUrl" value="${r.campaign.privacyUrl||''}" placeholder="https://example.com/privacy" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <div class="label">Opt-in URL <span class="text-red-400">*</span></div>
              <input class="input" id="optinUrl" value="${r.campaign.optinUrl||''}" placeholder="https://example.com/subscribe" />
            </div>
            <div>
              <div class="label">Terms & Conditions URL <span class="text-red-400">*</span></div>
              <input class="input" id="termsUrl" value="${r.campaign.termsUrl||''}" placeholder="https://example.com/terms" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <div class="label">Industry <span class="text-red-400">*</span></div>
              <select class="input" id="industry">
                ${['','E-commerce','Healthcare','Finance','Retail','Technology','Real Estate','Education','Non-profit','Other'].map(i =>
                  `<option value="${i}" ${(r.campaign.industry||'')===i?'selected':''}>${i||'Select industry...'}</option>`
                ).join('')}
              </select>
            </div>
            <div>
              <div class="label">Opt-in Screenshot URL <span class="text-red-400">*</span></div>
              <input class="input" id="optinScreenshot" value="${r.campaign.optinScreenshot||''}" placeholder="https://s3.../screenshot.png" />
            </div>
          </div>
          ${r.channelType !== '10DLC' ? `
          <div class="grid grid-cols-2 gap-3" id="tfn-fields">
            <div>
              <div class="label">Message Frequency <span class="text-red-400">*</span></div>
              <input class="input" id="msgFrequency" value="${r.campaign.msgFrequency||''}" placeholder="e.g. 4x/month" />
            </div>
            <div>
              <div class="label">Est. Monthly Volume <span class="text-red-400">*</span></div>
              <input class="input" id="estVolume" value="${r.campaign.estVolume||''}" placeholder="e.g. 50000" type="number" />
            </div>
          </div>` : ''}
          ${r.channelType === 'Short Code' ? `
          <div>
            <div class="label">Contact Support Page URL <span class="text-red-400">*</span></div>
            <input class="input" id="supportUrl" value="${r.campaign.supportUrl||''}" placeholder="https://example.com/support" />
          </div>` : ''}
        </div>

        <div class="mt-5 pt-4 border-t border-[#2a2d3a]">
          <div class="text-xs font-semibold text-[#8b8fa8] uppercase tracking-wider mb-3">Optional Fields</div>
          <div class="grid grid-cols-2 gap-3">
            <div class="flex items-center gap-2">
              <input type="checkbox" id="directLender" ${r.campaign.directLender?'checked':''} class="accent-[#6c63ff]" />
              <label class="text-sm text-[#8b8fa8]" for="directLender">Direct Lender</label>
            </div>
            <div class="flex items-center gap-2">
              <input type="checkbox" id="ageGate" ${r.campaign.ageGate?'checked':''} class="accent-[#6c63ff]" />
              <label class="text-sm text-[#8b8fa8]" for="ageGate">Age Gate Required</label>
            </div>
            <div class="flex items-center gap-2">
              <input type="checkbox" id="embeddedPhone" ${r.campaign.embeddedPhone?'checked':''} class="accent-[#6c63ff]" />
              <label class="text-sm text-[#8b8fa8]" for="embeddedPhone">Embedded Phone Number</label>
            </div>
          </div>
        </div>
      </div>

      <div id="s1-errors" class="mb-4"></div>

      <div class="flex gap-3" id="s1-actions" style="${r.channelType ? '' : 'display:none'}">
        <button class="btn btn-primary flex-1" onclick="submitDraft()">Submit Registration →</button>
      </div>
    </div>
  `;
}

function onChannelTypeChange() {
  const val = document.getElementById('channelType').value;
  app.registration.channelType = val;
  const badge = document.getElementById('channel-badge');
  if (val) {
    badge.textContent = val;
    badge.style.display = 'inline-flex';
  }
  renderS1();
}

function submitDraft() {
  const r = app.registration;
  const errors = [];
  const get = id => document.getElementById(id)?.value?.trim() || '';

  const required = ['messageDesc','exampleMsg','homepageUrl','privacyUrl','optinUrl','termsUrl','optinScreenshot'];
  const labels = { messageDesc:'Message Description', exampleMsg:'Example Message', homepageUrl:'Home Page URL', privacyUrl:'Privacy Policy URL', optinUrl:'Opt-in URL', termsUrl:'T&C URL', optinScreenshot:'Opt-in Screenshot URL' };
  required.forEach(f => { if (!get(f)) errors.push(labels[f] + ' is required'); });
  if (!document.getElementById('industry')?.value) errors.push('Industry is required');
  if (r.channelType !== '10DLC') {
    if (!get('msgFrequency')) errors.push('Message Frequency is required');
    if (!get('estVolume')) errors.push('Estimated Monthly Volume is required');
  }
  if (r.channelType === 'Short Code') {
    if (!get('supportUrl')) errors.push('Contact Support Page URL is required');
  }

  if (errors.length) {
    document.getElementById('s1-errors').innerHTML = errors.map(e =>
      `<div class="feedback-item feedback-error mb-1">${e}</div>`
    ).join('');
    return;
  }

  // Save campaign fields
  r.campaign = {
    messageDesc: get('messageDesc'),
    exampleMsg: get('exampleMsg'),
    homepageUrl: get('homepageUrl'),
    privacyUrl: get('privacyUrl'),
    optinUrl: get('optinUrl'),
    termsUrl: get('termsUrl'),
    optinScreenshot: get('optinScreenshot'),
    industry: document.getElementById('industry').value,
    msgFrequency: get('msgFrequency'),
    estVolume: get('estVolume'),
    supportUrl: get('supportUrl'),
    directLender: document.getElementById('directLender')?.checked || false,
    ageGate: document.getElementById('ageGate')?.checked || false,
    embeddedPhone: document.getElementById('embeddedPhone')?.checked || false,
  };

  // Determine auto-approval (simulate: 70% chance for demo)
  r.autoApproved = Math.random() > 0.3;
  r.cycleCount = (r.cycleCount || 0) + 1;

  fireWebhook('REGISTRATION_SUBMITTED', { registration_id: r.id, channel_type: r.channelType, org_id: 'ORG-DEMO' });
  transitionTo('S2');
}

// S2 — Campaign Audit In Progress
function renderS2() {
  const r = app.registration;
  document.getElementById('main-content').innerHTML = `
    <div class="fade-in">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center text-sm font-bold" style="background:#1a2035;color:#3b82f6">S2</div>
        <div>
          <div class="font-semibold">Campaign Audit In Progress</div>
          <div class="text-xs text-[#8b8fa8]">Automated review running${r.autoApproved ? '' : ' → Human review queued'}</div>
        </div>
        <div class="ml-auto pill pill-system">System</div>
      </div>

      <div class="card p-6 text-center">
        <div class="spin w-10 h-10 rounded-full border-4 border-[#2a2d3a] border-t-[#6c63ff] mx-auto mb-5"></div>
        <div class="font-semibold mb-2">Audit Running</div>
        <div class="text-sm text-[#8b8fa8] mb-4" id="audit-substate">
          ${r.autoApproved ? 'Automated Review...' : 'Automated Review → Human Review Queue...'}
        </div>
        <div class="text-xs text-[#8b8fa8] max-w-xs mx-auto">The audit always produces output regardless of content quality. No pass/fail gate — feedback is advisory.</div>
      </div>
    </div>
  `;

  // Simulate audit delay
  setTimeout(() => {
    if (!r.autoApproved) {
      document.getElementById('audit-substate').textContent = 'Human Review in progress...';
    }
  }, 1000);

  setTimeout(() => {
    r.auditFeedback = generateAuditFeedback(r);
    r.cnpSuggestion = generateCnpSuggestion(r);
    fireWebhook('AUDIT_FEEDBACK_AVAILABLE', {
      registration_id: r.id,
      auto_approved: r.autoApproved,
      cnp_suggestion: r.cnpSuggestion,
      feedback_item_count: r.auditFeedback.length
    });
    transitionTo('S3');
  }, r.autoApproved ? 2000 : 3500);
}

function generateAuditFeedback(r) {
  const items = [];
  if (!r.campaign.directLender && !r.campaign.ageGate) {
    items.push({ id:'AF1', severity:'info', description:'Optional fields not completed', recommendation:'Consider completing Direct Lender, Age Gate, and Keyword Responder fields for better carrier approval rates.' });
  }
  if (r.campaign.directLender) {
    items.push({ id:'AF2', severity:'warn', description:'TCPA compliance check triggered', recommendation:'Direct Lender flag detected. Ensure sample messages include required TCPA compliance language (stop instructions, message frequency disclosure).' });
  }
  if (r.campaign.ageGate) {
    items.push({ id:'AF3', severity:'warn', description:'Age gate language required', recommendation:'Age Gate Required flag detected. Verify opt-in flow and sample messages include age verification language.' });
  }
  if (r.campaign.exampleMsg && r.campaign.exampleMsg.length < 30) {
    items.push({ id:'AF4', severity:'error', description:'Example message too brief', recommendation:'Provide a more complete example message demonstrating actual content, opt-out instructions, and message frequency.' });
  }
  if (!r.campaign.exampleMsg?.toLowerCase().includes('stop')) {
    items.push({ id:'AF5', severity:'warn', description:'Opt-out instruction missing from example', recommendation:'Industry best practice: include STOP opt-out instruction in example message copy.' });
  }
  items.push({ id:'AF6', severity:'info', description:'Keyword responder copy not provided', recommendation:'Adding HELP, STOP, and START keyword responses improves carrier approval rates.' });
  return items;
}

function generateCnpSuggestion(r) {
  const suggestions = {
    '10DLC': 'Twilio / Sinch',
    'TFN (Toll-Free)': 'Bandwidth / Vonage',
    'Short Code': 'Syniverse / Zipwhip',
  };
  return suggestions[r.channelType] || 'Twilio';
}

// S3 — Audit Feedback Presented
function renderS3() {
  const r = app.registration;
  const feedback = r.auditFeedback || [];

  const severityClass = { error: 'feedback-error', warn: 'feedback-warn', info: 'feedback-info' };

  document.getElementById('main-content').innerHTML = `
    <div class="fade-in">
      <div class="flex items-center gap-3 mb-6">

let einVerified = false;

function verifyEIN() {
  const ein = document.getElementById('ein').value.trim();
  const status = document.getElementById('ein-status');

  if (!ein || ein.length < 9) {
    status.textContent = '✗ Enter a valid EIN (XX-XXXXXXX)';
    status.className = 'text-xs mt-1 text-red-400';
    einVerified = false;
    return;
  }

  status.textContent = 'Verifying with IRS...';
  status.className = 'text-xs mt-1 text-[#8b8fa8]';

  setTimeout(() => {
    // Simulate: EINs starting with '00' fail
    if (ein.startsWith('00')) {
      status.textContent = '✗ EIN not found — check number and retry';
      status.className = 'text-xs mt-1 text-red-400';
      einVerified = false;
      fireWebhook('EIN_VALIDATION_ERROR', { registration_id: app.registration.id, ein_prefix: ein.slice(0,2) });
    } else {
      status.textContent = '✓ EIN verified — match found';
      status.className = 'text-xs mt-1 text-[#00d4aa]';
      einVerified = true;
      app.registration.brand.einVerified = true;
    }
  }, 1200);
}

function submitBrand() {
  const r = app.registration;
  const get = id => document.getElementById(id)?.value?.trim() || '';
  const errors = [];

  if (!get('legalName')) errors.push('Legal Entity Name is required');
  if (!get('dba')) errors.push('DBA is required');
  if (!get('ein')) errors.push('EIN is required');
  if (!einVerified) errors.push('EIN must be verified before submitting');
  if (!get('bizAddress')) errors.push('Business Address is required');
  if (!document.getElementById('bizType').value) errors.push('Business Type is required');
  if (!get('supportEmail')) errors.push('Support Email is required');
  if (!get('supportPhone')) errors.push('Support Phone is required');
  if (!document.getElementById('brandIndustry').value) errors.push('Industry is required');

  if (errors.length) {
    document.getElementById('s4-errors').innerHTML = errors.map(e =>
      `<div class="feedback-item feedback-error mb-1">${e}</div>`
    ).join('');
    return;
  }

  r.brand = {
    ...r.brand,
    legalName: get('legalName'),
    dba: get('dba'),
    ein: get('ein'),
    country: document.getElementById('country').value,
    bizType: document.getElementById('bizType').value,
    bizAddress: get('bizAddress'),
    supportEmail: get('supportEmail'),
    supportPhone: get('supportPhone'),
    industry: document.getElementById('brandIndustry').value,
    brandId: 'BRD-' + Math.random().toString(36).slice(2,7).toUpperCase(),
  };

  r.brandCycleCount = (r.brandCycleCount || 0) + 1;
  fireWebhook('BRAND_SUBMITTED', { registration_id: r.id, brand_id: r.brand.brandId });
  transitionTo('S5');
}

// ============================================================
// CLOSE REGISTRATION (available from any state)
// ============================================================
function closeRegistration() {
  if (!confirm('Close this registration? The artifact will be retained read-only.')) return;
  app.registration.closureReason = 'USER_CLOSED';
  fireWebhook('REGISTRATION_CLOSED', { registration_id: app.registration.id, reason: 'USER_CLOSED', actor_type: 'user' });
  transitionTo('S8');
}

function newRegistration() {
  app = { currentState: null, registration: {}, webhooks: app.webhooks, eventLog: app.eventLog, activeTab: app.activeTab, auditProcessing: false, brandProcessing: false, registryProcessing: false };
  einVerified = false;
  document.getElementById('channel-badge').style.display = 'none';
  document.getElementById('close-btn').style.display = 'none';
  renderStateNav();
  renderWelcome();
  updateProgress();
}

// ============================================================
// HELPERS
// ============================================================
function recordFeedbackDisposition(type, action) {
  const r = app.registration;
  if (type === 'campaign') {
    r.feedbackDisposition = { items_presented: r.auditFeedback?.length || 0, action };
  }
}

function fireWebhook(event, payload) {
  const entry = { event, payload, ts: new Date().toLocaleTimeString() };
  app.webhooks.unshift(entry);
  logEvent(`Webhook: ${event}`, 'webhook');
  renderWebhooks();
}

function logEvent(msg, type) {
  app.eventLog.unshift({ msg, type, ts: new Date().toLocaleTimeString() });
  renderEventLog();
}

function renderWebhooks() {
  const colors = { REGISTRATION_SUBMITTED:'#6c63ff', AUDIT_FEEDBACK_AVAILABLE:'#3b82f6', CAMPAIGN_RESUBMITTED:'#f5a623', PROCEEDING_TO_BRAND:'#00d4aa', BRAND_SUBMITTED:'#6c63ff', BRAND_VALIDATED:'#00d4aa', BRAND_FEEDBACK_PROVIDED:'#f5a623', BRAND_RESUBMITTED:'#f5a623', PROCEEDING_TO_REGISTRY:'#00d4aa', REGISTRY_SUBMITTED:'#00d4aa', REGISTRY_SUBMISSION_FAILED:'#e74c3c', REGISTRATION_CLOSED:'#e74c3c', EIN_VALIDATION_ERROR:'#e74c3c' };

  document.getElementById('webhook-list').innerHTML = app.webhooks.slice(0,20).map(w => `
    <div class="webhook-item">
      <div class="font-bold mb-1" style="color:${colors[w.event]||'#8b8fa8'}">${w.event}</div>
      <div class="text-[#8b8fa8] mb-1">${w.ts}</div>
      <div class="text-[#6b7280] text-xs">${JSON.stringify(w.payload, null, 0).slice(0, 120)}</div>
    </div>
  `).join('');
}

function renderEventLog() {
  document.getElementById('log-list').innerHTML = app.eventLog.slice(0,40).map(e => `
    <div class="text-xs py-1.5 border-b border-[#1e2235] flex gap-2">
      <span class="text-[#8b8fa8] flex-shrink-0">${e.ts}</span>
      <span class="${e.type === 'webhook' ? 'text-[#6c63ff]' : e.type === 'transition' ? 'text-[#00d4aa]' : 'text-[#8b8fa8]'}">${e.msg}</span>
    </div>
  `).join('');
}

function switchTab(tab) {
  app.activeTab = tab;
  document.getElementById('tab-webhooks').className = 'tab' + (tab === 'webhooks' ? ' active' : '');
  document.getElementById('tab-log').className = 'tab' + (tab === 'log' ? ' active' : '');
  document.getElementById('webhook-list').style.display = tab === 'webhooks' ? 'block' : 'none';
  document.getElementById('log-list').style.display = tab === 'log' ? 'block' : 'none';
}

const STATE_ORDER = ['S1','S2','S3','S4','S5','S6','S7','P2','S8'];
const STATE_PROGRESS = { S1:10, S2:25, S3:38, S4:52, S5:68, S6:72, S7:85, P2:100, S8:0 };

function renderStateNav() {
  const current = app.currentState;
  const completedStates = getCompletedStates();

  document.getElementById('state-nav').innerHTML = Object.values(STATES).map(s => {
    const isActive = current === s.id;
    const isCompleted = completedStates.includes(s.id);
    const isTerminal = s.flags.includes('terminal') || s.id === 'P2';

    let statusDot = '';
    if (isActive) statusDot = `<span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${s.color}"></span>`;
    else if (isCompleted) statusDot = `<span class="w-2 h-2 rounded-full flex-shrink-0 bg-[#00d4aa]"></span>`;
    else statusDot = `<span class="w-2 h-2 rounded-full flex-shrink-0 bg-[#2a2d3a]"></span>`;

    const actorPills = {
      User: '<span class="pill pill-user" style="font-size:9px;padding:1px 6px">User</span>',
      System: '<span class="pill pill-system" style="font-size:9px;padding:1px 6px">System</span>',
      terminal: '<span class="pill" style="background:#2e0d0d;color:#f77;font-size:9px;padding:1px 6px">Terminal</span>',
    };

    return `
      <div class="flex items-center gap-2 px-3 py-2 rounded-lg cursor-default ${isActive ? 'bg-[#1e1a35]' : ''} ${isCompleted && !isActive ? 'opacity-60' : ''}">
        ${statusDot}
        <div class="flex-1 min-w-0">
          <div class="text-xs font-medium truncate ${isActive ? 'text-white' : 'text-[#8b8fa8]'}">${s.name}</div>
          <div class="flex gap-1 mt-0.5 flex-wrap">
            ${actorPills[s.actor] || ''}
            ${s.flags.includes('auto') ? '<span class="badge-auto" style="font-size:9px;padding:1px 5px">Auto</span>' : ''}
            ${s.flags.includes('open') ? '<span class="badge-open" style="font-size:9px;padding:1px 5px">⚠</span>' : ''}
          </div>
        </div>
        <div class="text-[10px] text-[#4a4d5f] font-mono">${s.id}</div>
      </div>
    `;
  }).join('');
}

function getCompletedStates() {
  const order = ['S1','S2','S3','S4','S5','S6','S7','P2'];
  const idx = order.indexOf(app.currentState);
  return idx > 0 ? order.slice(0, idx) : [];
}

function updateProgress() {
  const pct = app.currentState ? (STATE_PROGRESS[app.currentState] || 0) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  const labels = { S1:'Draft', S2:'Audit running...', S3:'Reviewing feedback', S4:'Brand collection', S5:'Brand validation...', S6:'Brand feedback', S7:'Submitting...', P2:'Complete!', S8:'Closed' };
  document.getElementById('progress-label').textContent = app.currentState ? labels[app.currentState] || app.currentState : 'Not started';
}

function updateArtifactSummary() {
  const r = app.registration;
  if (!r.id) { document.getElementById('artifact-summary').innerHTML = '<div class="text-[#4a4d5f]">No active registration</div>'; return; }

  const items = [
    r.id && `<div><span class="text-[#4a4d5f]">ID</span> <span class="font-mono">${r.id.slice(0,10)}</span></div>`,
    r.channelType && `<div><span class="text-[#4a4d5f]">Channel</span> ${r.channelType}</div>`,
    r.autoApproved !== undefined && `<div><span class="text-[#4a4d5f]">Auto-approved</span> ${r.autoApproved ? '<span class="text-[#00d4aa]">Yes</span>' : '<span class="text-[#f5a623]">No</span>'}`,
    r.cycleCount && `<div><span class="text-[#4a4d5f]">Audit cycles</span> ${r.cycleCount}</div>`,
    r.brand?.brandId && `<div><span class="text-[#4a4d5f]">Brand</span> <span class="font-mono">${r.brand.brandId}</span></div>`,
    r.cnpSuggestion && `<div><span class="text-[#4a4d5f]">CNP</span> ${r.cnpSuggestion}${r.cnpOverridden ? ' ⚠' : ''}</div>`,
    r.registrySubmissionId && `<div><span class="text-[#4a4d5f]">Sub ID</span> <span class="font-mono text-[9px]">${r.registrySubmissionId}</span></div>`,
  ].filter(Boolean);

  document.getElementById('artifact-summary').innerHTML = items.join('') || '<div class="text-[#4a4d5f]">Empty</div>';
}
</script>
</body>
</html>
